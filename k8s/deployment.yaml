apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway-service
  namespace: allmart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apigateway-service
  template:
    metadata:
      labels:
        app: apigateway-service
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: apigateway-service
          image: 646596232446.dkr.ecr.ap-northeast-2.amazonaws.com/apigateway-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: CONFIG_SERVER_URI
              value: "http://config-server:8888"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "10.0.1.146:19092,10.0.1.146:19093,10.0.1.146:19094"
            - name: REDIS_SENTINEL_NODES
              value: "10.0.1.146:26379,10.0.1.146:26380,10.0.1.146:26381"
            - name: REDIS_MASTER_NAME
              value: "mymaster"
            - name: TEMPO_ENDPOINT
              value: "http://43.200.2.221:4318/v1/traces"
            - name: LOKI_URL
              value: "http://43.200.2.221:3100/loki/api/v1/push"
          resources:
            requests:
              memory: "384Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8000
            initialDelaySeconds: 200
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8000
            initialDelaySeconds: 200
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: apigateway-service
  namespace: allmart
spec:
  selector:
    app: apigateway-service
  ports:
    - port: 8000
      targetPort: 8000
